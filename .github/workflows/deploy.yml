name: Deploy (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT: "771675725990"
  LAMBDA_REPO: cloudnaut-support-desk-lambda
  BACKEND_STACK: CloudnautSupportDeskLambdaStack
  FRONTEND_STACK: CloudnautSupportDeskFrontendStack
  COGNITO_USER_POOL_ID: ap-south-1_ywRrGmxpM
  COGNITO_APP_CLIENT_ID: 36hud2677sjbeb1qjov197fmai

jobs:
  build-and-push:
    name: Build and push Lambda image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Ensure Lambda ECR repository exists
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories --repository-names "$LAMBDA_REPO" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$LAMBDA_REPO" \
              --image-scanning-configuration scanOnPush=true
          fi

      - name: Build and push immutable Lambda image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          docker build \
            -f workspace/lambda/Dockerfile \
            -t "$REGISTRY/$LAMBDA_REPO:${{ github.sha }}" \
            -t "$REGISTRY/$LAMBDA_REPO:latest" workspace
          docker push "$REGISTRY/$LAMBDA_REPO:${{ github.sha }}"
          docker push "$REGISTRY/$LAMBDA_REPO:latest"

  deploy-infra:
    name: Deploy Lambda infrastructure (guarded)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Install frontend dependencies for CDK assets
        working-directory: workspace/frontend
        run: npm ci

      - name: Build frontend assets for CDK
        working-directory: workspace/frontend
        run: npm run build

      - name: Build CDK
        working-directory: infra
        run: npm run build

      - name: Prepare, inspect, and execute guarded Lambda change set
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          CDK_IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          CS="ci-guard-${{ github.run_id }}-${{ github.run_attempt }}"
          CLEANED=0
          EXECUTION_STARTED=0

          delete_change_set() {
            aws cloudformation delete-change-set \
              --stack-name "$BACKEND_STACK" \
              --change-set-name "$CS"
            CLEANED=1
          }

          cleanup() {
            local exit_code=$?
            if [[ "$EXECUTION_STARTED" == "0" && "$CLEANED" == "0" ]]; then
              delete_change_set || true
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT

          npx cdk deploy "$BACKEND_STACK" \
            --method prepare-change-set \
            --change-set-name "$CS" \
            -c cognitoUserPoolId="$COGNITO_USER_POOL_ID" \
            -c cognitoAppClientId="$COGNITO_APP_CLIENT_ID" \
            --require-approval never

          WAIT_FAILED=0
          if ! aws cloudformation wait change-set-create-complete \
            --stack-name "$BACKEND_STACK" \
            --change-set-name "$CS"; then
            WAIT_FAILED=1
          fi

          if ! aws cloudformation describe-change-set \
            --stack-name "$BACKEND_STACK" \
            --change-set-name "$CS" \
            --output json > /tmp/guarded-change-set.json; then
            echo "::error::Could not describe change set $CS"
            exit 1
          fi

          STATUS=$(jq -r '.Status // empty' /tmp/guarded-change-set.json)
          STATUS_REASON=$(jq -r '.StatusReason // empty' /tmp/guarded-change-set.json)
          if [[ "$WAIT_FAILED" == "1" ]]; then
            if [[ "$STATUS" == "FAILED" ]]; then
              case "$STATUS_REASON" in
                "The submitted information didn't contain changes."*|"No updates are to be performed."*)
                  echo "No infrastructure changes are required."
                  delete_change_set
                  exit 0
                  ;;
              esac
            fi
            echo "::error::Change set $CS did not reach CREATE_COMPLETE"
            [[ -n "$STATUS_REASON" ]] && echo "Reason: $STATUS_REASON"
            exit 1
          fi

          if [[ "$STATUS" != "CREATE_COMPLETE" ]]; then
            echo "::error::Unexpected change-set status: ${STATUS:-unknown}"
            [[ -n "$STATUS_REASON" ]] && echo "Reason: $STATUS_REASON"
            exit 1
          fi

          CHANGE_SET_ARN=$(jq -r '.ChangeSetId // empty' /tmp/guarded-change-set.json)
          if [[ -z "$CHANGE_SET_ARN" || "$CHANGE_SET_ARN" == "null" ]]; then
            echo "::error::Change set ARN is missing"
            exit 1
          fi

          BLOCKED=$(jq -r '
            (.Changes // [])[]
            | .ResourceChange
            | select(
                (
                  .Replacement == "True"
                  or .Replacement == "Conditional"
                  or .Action == "Remove"
                  or .Action == "Delete"
                )
                and (
                  .ResourceType != "AWS::CDK::Metadata"
                  or .Action != "Modify"
                  or .Replacement != "Conditional"
                )
              )
            | [(.LogicalResourceId // "unknown"), (.ResourceType // "unknown"), (.Action // "unknown"), (.Replacement // "None")]
            | @tsv
          ' /tmp/guarded-change-set.json)

          if [[ -n "$BLOCKED" ]]; then
            echo "::error::Refusing to execute change set; destructive changes detected:"
            printf '%s\n' "$BLOCKED"
            delete_change_set
            exit 1
          fi

          echo "Executing inspected change set: $CHANGE_SET_ARN"
          EXECUTION_STARTED=1
          npx cdk deploy "$BACKEND_STACK" \
            --method execute-change-set \
            --change-set-name "$CHANGE_SET_ARN" \
            -c cognitoUserPoolId="$COGNITO_USER_POOL_ID" \
            -c cognitoAppClientId="$COGNITO_APP_CLIENT_ID" \
            --require-approval never

      - name: Verify public Lambda API health
        run: |
          set -euo pipefail
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$BACKEND_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          test -n "$API_URL" && test "$API_URL" != "None"
          for i in $(seq 1 10); do
            if curl -fsS "$API_URL/health" >/dev/null; then
              echo "API Gateway healthy"
              exit 0
            fi
            sleep 6
          done
          echo "::error::API Gateway health check failed"
          exit 1

  deploy-frontend:
    name: Deploy frontend (S3 and CloudFront)
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: production
    defaults:
      run:
        working-directory: workspace/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workspace/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve backend API URL and build frontend
        run: |
          set -euo pipefail
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$BACKEND_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          test -n "$API_URL" && test "$API_URL" != "None"
          sed -i '/^VITE_API_URL=/d' .env.production
          echo "VITE_API_URL=$API_URL" >> .env.production
          npm run build

      - name: Resolve frontend bucket
        id: bucket
        run: |
          set -euo pipefail
          B=$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          test -n "$B" && test "$B" != "None"
          echo "name=$B" >> "$GITHUB_OUTPUT"

      - name: Upload frontend assets
        run: |
          set -euo pipefail
          BUCKET="${{ steps.bucket.outputs.name }}"
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          set -euo pipefail
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          test -n "$DISTRIBUTION_ID" && test "$DISTRIBUTION_ID" != "None"
          INV=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query "Invalidation.Id" --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" --id "$INV"

      - name: Smoke-test frontend
        run: |
          set -euo pipefail
          URL=$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendUrl'].OutputValue" \
            --output text)
          test -n "$URL" && test "$URL" != "None"
          curl -fsS "$URL" | grep -qi '<div id="root"' \
            && echo "Frontend served successfully" \
            || { echo "::error::Frontend root element not found"; exit 1; }

  summary:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-infra, deploy-frontend]
    steps:
      - name: Write deployment summary
        run: |
          {
            echo "## Deployment complete"
            echo "- Lambda infrastructure deployed from the inspected change set."
            echo "- Commit SHA: \`${{ github.sha }}\`"
            echo "- Lambda image and frontend publication succeeded."
          } >> "$GITHUB_STEP_SUMMARY"
