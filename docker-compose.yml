services:
  db:
    image: postgres:16-alpine
    container_name: app_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=cloudnaut
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting}
      - POSTGRES_DB=cloudnaut_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnaut -d cloudnaut_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build: 
      context: ./workspace/frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    ports:
      - "3000:5173"
    environment:
      - REACT_APP_API_URL=http://localhost:4000
    depends_on:
      - backend
      - api
      - db
    networks:
      - app_network
    restart: unless-stopped

  backend:
    build: 
      context: .
      dockerfile: workspace/backend/Dockerfile
    container_name: app_backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://cloudnaut:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting}@db:5432/cloudnaut_db
      - DB_SSLMODE=disable
      - API_SERVICE_URL=http://api:4000
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env before starting}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET=support-attachments
      - MINIO_SECURE=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env before starting}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env before starting}
    depends_on:
      - db
      - mailpit
      - minio
    networks:
      - app_network
    restart: unless-stopped

  minio:
    image: cloudnaut-minio:local
    build:
      context: ./workspace/minio
      dockerfile: Dockerfile
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env before starting}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env before starting}
    volumes:
      - minio_data:/data

    networks:
      - app_network
    restart: unless-stopped

  api:
    build: 
      context: ./workspace/api
      dockerfile: Dockerfile
    container_name: app_api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - BACKEND_URL=http://backend:8001
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env before starting}
    depends_on:
      - backend
      - db
    networks:
      - app_network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:
  minio_data:
